name: Docker Image CI

on:
  push:
    paths:
      - "retail_app/**"   # Trigger only if files under retail_app change

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # safer to pin to LTS

      - name: Build Docker image
        run: |
          docker build \
            -f retail_app/Dockerfile \
            -t contag01lz1-h3esedfsd7axgtg5.azurecr.io/retail_app:1.0.0 \
            -t contag01lz1-h3esedfsd7axgtg5.azurecr.io/retail_app:${{ github.sha }} \
            ./retail_app

      - name: Log in to Azure Container Registry
        run: echo ${{ secrets.AZURE_ACR_PASSWORD }} | docker login contag01lz1-h3esedfsd7axgtg5.azurecr.io \
              -u ${{ secrets.AZURE_ACR_USERNAME }} --password-stdin

      - name: Push image
        run: |
          docker push contag01lz1-h3esedfsd7axgtg5.azurecr.io/retail_app:1.0.0
          docker push contag01lz1-h3esedfsd7axgtg5.azurecr.io/retail_app:${{ github.sha }}
